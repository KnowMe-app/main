name: Rebuild matchingFeedIndex

# Перелік опублікованих карток (`functions/feedIndex.js`): тригер функцій
# веде його на кожен запис картки, а цей workflow заповнює його цілком —
# першого разу після розгортання й будь-коли, коли перелік треба вирівняти.
# Поки в переліку немає позначки `_built`, застосунок ним не користується.
#
# Вивантаження карток лягає лише у файл runner-а: репозиторій публічний, і в
# журнал іде сама кількість.

on:
  workflow_dispatch:

concurrency:
  group: rebuild-feed-index
  cancel-in-progress: false

env:
  PROJECT_ID: webringitapp

jobs:
  rebuild:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: '[ -n "$SA" ] || { echo "::error::Немає секрету FIREBASE_SERVICE_ACCOUNT"; exit 1; }'

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Export published cards
        run: |
          npx --yes firebase-tools@15.34.0 database:get /matchingCards \
            --order-by feedDate --start-at '""' \
            --project "$PROJECT_ID" --non-interactive -o "$RUNNER_TEMP/cards.json" > /dev/null
          [ -s "$RUNNER_TEMP/cards.json" ] || { echo "::error::Порожнє вивантаження"; exit 1; }

      - name: Build and write index
        run: |
          node scripts/buildFeedIndex.mjs "$RUNNER_TEMP/cards.json" "$RUNNER_TEMP/index.json" | tee -a "$GITHUB_STEP_SUMMARY"
          npx --yes firebase-tools@15.34.0 database:set /matchingFeedIndex "$RUNNER_TEMP/index.json" \
            --project "$PROJECT_ID" --non-interactive --force > /dev/null
          echo "matchingFeedIndex записано" >> "$GITHUB_STEP_SUMMARY"
