name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Ручний запуск з вкладки Actions. Потрібен рівно тоді, коли деплой стоїть, а
  # коміта, яким його штовхнути, немає: прогін завис у черзі без раннера,
  # збірка впала через щось поза кодом, або gh-pages розійшлася з main.
  # Без цього тригера єдиний спосіб перезібрати — покласти в main новий коміт.
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # workflow_dispatch дозволяє вибрати будь-яку гілку, тому окремо захищаємо
    # продакшн-деплой від ручного запуску коду, який ще не потрапив у main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Create .env file
        run: |
          echo "REACT_APP_API_KEY=${{ secrets.REACT_APP_API_KEY }}" >> .env
          echo "REACT_APP_AUTH_DOMAIN=${{ secrets.REACT_APP_AUTH_DOMAIN }}" >> .env
          echo "REACT_APP_DATABASE_URL=${{ secrets.REACT_APP_DATABASE_URL }}" >> .env
          echo "REACT_APP_PROJECT_ID=${{ secrets.REACT_APP_PROJECT_ID }}" >> .env
          echo "REACT_APP_STORAGE_BUCKET=${{ secrets.REACT_APP_STORAGE_BUCKET }}" >> .env
          echo "REACT_APP_MESSAGING_SENDER_ID=${{ secrets.REACT_APP_MESSAGING_SENDER_ID }}" >> .env
          echo "REACT_APP_APP_ID=${{ secrets.REACT_APP_APP_ID }}" >> .env
          # Сюди не кладіть жодного справжнього секрету: увесь цей `.env` —
          # публічний JS сайту. Щойно код читає `process.env.X`, якого тут немає,
          # CRA вшиває в збірку обʼєкт `process.env` цілком, з кожним рядком
          # файлу. Так ключ OpenAI (коду, що його читав, давно немає) лежав у
          # `main.*.js` на проді; 14.11 його й `REACT_APP_USER1` звідси прибрано.
          # Імʼя бота входу через Telegram (без @). Не секрет — змінна репозиторію;
          # порожня — кнопки Telegram на вході немає, лишається пошта.
          echo "REACT_APP_TELEGRAM_BOT_USERNAME=${{ vars.REACT_APP_TELEGRAM_BOT_USERNAME }}" >> .env
          # Публічний VAPID-ключ Firebase Cloud Messaging (Project settings →
          # Cloud Messaging → Web Push certificates). Не секрет — змінна
          # репозиторію; порожня — кнопки push-сповіщень у «Моєму профілі» немає.
          echo "REACT_APP_FIREBASE_VAPID_KEY=${{ vars.REACT_APP_FIREBASE_VAPID_KEY }}" >> .env

      # Тести стоять між lint і збіркою: червоний тест зупиняє деплой. Доти
      # CI робив лише lint і збірку, і зміна, яка ламала поведінку, доїжджала в
      # прод мовчки — а на `main` лежало 31 червоний тест, на які вже ніхто не
      # дивився. Тести функцій біжать без мережі (`node --test`).
      - name: Install, lint and test 🔧
        run: |
          npm install
          npm run lint:js
          CI=true npx react-scripts test --watchAll=false
          (cd functions && npm ci && npm test)

      - name: Build
        env:
          REACT_APP_PROFILE_PROPOSAL_STORAGE: ${{ vars.REACT_APP_PROFILE_PROPOSAL_STORAGE }}
        run: |
          case "$REACT_APP_PROFILE_PROPOSAL_STORAGE" in
            ''|legacy|unified) ;;
            *) echo '::error::REACT_APP_PROFILE_PROPOSAL_STORAGE must be legacy or unified'; exit 1 ;;
          esac
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
