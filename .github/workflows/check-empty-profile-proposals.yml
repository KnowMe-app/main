name: Check empty profile proposal cutover

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-empty-profile-proposals.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci --prefix functions
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Report aggregate preflight counts
        run: node scripts/checkEmptyProfileProposalCutover.js | tee -a "$GITHUB_STEP_SUMMARY"
