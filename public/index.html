<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon2.ico" />
    <!-- interactive-widget=resizes-visual: клавіатура лягає поверх сторінки, а не
         стискає її. Firefox на Android за замовчуванням стискав сторінку, і
         нижня панель вкладок (position: fixed; bottom: 0) підскакувала над
         клавіатурою на кожен фокус поля й падала на кожен blur — а форми
         застосунку зберігаються саме на blur. Chrome так поводиться й без
         цього ключа. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-visual" />
    <meta name="theme-color" content="#2B2620" />
    <meta
      name="description"
      content="KnowMe: Egg Donor mobile application. User Agreement and Privacy Policy"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Тема — до першого кадру: інакше той, хто обрав темну, бачив світлу
         заставку, а потім і світлий екран, доки `App` не поставить атрибут. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('appThemeMode') || localStorage.getItem('matchingThemeMode');
          if (mode === 'dark') {
            document.documentElement.setAttribute('data-km-theme', 'dark');
            document.documentElement.setAttribute('data-matching-theme', 'dark');
          }
        } catch (error) {
          // Памʼять браузера недоступна — світла тема.
        }
      })();
    </script>
    <!-- Заставка живе в #root і зникає з першим рендером React. Без неї
         людина на повільному звʼязку дивилась на білий екран, поки качається
         й розбирається JS, — на середньому телефоні це секунди. -->
    <style>
      html, body { background: #FAF9F7; }
      html[data-km-theme='dark'], html[data-km-theme='dark'] body { background: #14100C; }
      .km-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: 'DM Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1A1A1A;
      }
      html[data-km-theme='dark'] .km-splash { color: #FFF8EC; }
      .km-splash__mark { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; }
      .km-splash__mark span { color: #C9600F; }
      html[data-km-theme='dark'] .km-splash__mark span { color: #F08A2C; }
      .km-splash__bar {
        width: 112px;
        height: 3px;
        border-radius: 3px;
        background: rgba(201, 96, 15, 0.16);
        overflow: hidden;
      }
      .km-splash__bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #C9600F;
        animation: km-splash-run 1.1s ease-in-out infinite;
      }
      @keyframes km-splash-run {
        from { transform: translateX(-100%); }
        to { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .km-splash__bar span { width: 100%; opacity: 0.5; animation: none; }
      }
      .km-splash__label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Шрифти не блокують першого кадру: таблиця стилів Google — окремий
         домен і окремий круг мережею, і поки вона йшла, браузер не малював
         нічого, навіть заставку. Текст спершу йде системним шрифтом і
         підмінюється, щойно шрифт приїхав (`display=swap`). Playfair Display
         тут більше немає: `--km-font-display` завжди визначена, тож запасний
         шрифт у `MatchingHiddenList.styled.jsx` не вмикався ніколи. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <title>KnowMe: Egg Donor</title>

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="km-splash" role="status" aria-live="polite">
        <div class="km-splash__mark" aria-hidden="true">KnowMe<span>.</span></div>
        <div class="km-splash__bar" aria-hidden="true"><span></span></div>
        <span class="km-splash__label">Завантаження…</span>
      </div>
    </div>
  </body>
</html>
